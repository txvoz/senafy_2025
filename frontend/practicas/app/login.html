<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENAFY - Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">


    <!-- Jquery -->
    <script src="https://code.jquery.com/jquery-3.2.1.min.js"></script>
    <script>window.jQuery || document.write('<script src="../../assets/js/vendor/jquery-slim.min.js"><\/script>')</script>

    <!-- Custom scripts -->
    <link media="screen" rel="stylesheet" href="assets/css/login.css" />
    <script src="assets/js/core.js"></script>
    <script src="assets/js/login.js"></script>



</head>

<body>

    <div class="container-fluid">

        <div class="row min-vh-100 align-items-center">

            <!-- LOGIN -->
            <div class="col-lg-5 px-lg-5 px-4">

                <div class="auth-card">

                    <div class="logo">
                        <div class="logo-circle">
                            <i class="bi bi-music-note"></i>
                        </div>
                        SENAFy
                    </div>


                    <div id="logup-form" >

                        <form action="#">

                            <div class="mb-4">
                                <select id="id_type" class="form-control" required>
                                    <option>Seleccione opcion</option>
                                    <option value="CC">CC</option>
                                    <option value="CE">CE</option>
                                    <option value="TI">TI</option>
                                </select>
                            </div>

                            <div class="mb-4">
                                <input id="id_number" type="number" class="form-control" placeholder="Identificacion" required>
                            </div>

                            <div class="mb-4">
                                <input id="first_name" type="text" class="form-control" placeholder="Nombres" required>
                            </div>

                            <div class="mb-4">
                                <input id="last_name" type="text" class="form-control" placeholder="Apellidos" required>
                            </div>

                            <div class="mb-4">
                                <select id="gender" class="form-control" required>
                                    <option>Seleccione opcion</option>
                                    <option value="F">F</option>
                                    <option value="M">M</option>
                                    <option value="O">O</option>
                                </select>
                            </div>

                            <div class="mb-4">
                                <input id="email" type="email" class="form-control" placeholder="Correo electrónico" required>
                            </div>

                            <div class="mb-4">
                                <input id="pwd" type="password" class="form-control" placeholder="Contraseña" required>
                            </div>

                            <button type="submit" class="btn btn-senafy w-100">
                                Crear usuario
                            </button>

                        </form>

                    </div>

                    <div id="login-form" style="display: none;">
                        <form>

                            <div class="mb-4">
                                <input type="email" class="form-control" placeholder="Correo electrónico">
                            </div>

                            <div class="mb-3">
                                <input type="password" class="form-control" placeholder="Contraseña">
                            </div>

                            <div class="text-center mb-4">
                                <a href="#" class="forgot-link">
                                    ¿Olvidaste tu contraseña?
                                </a>
                            </div>

                            <button class="btn btn-senafy w-100">
                                Iniciar sesión
                            </button>

                        </form>

                        <div class="separator">
                            <span>o</span>
                        </div>

                        <h2 class="section-title">
                            Registrarse
                        </h2>

                        <div class="mb-4">
                            <input type="email" class="form-control" placeholder="Correo electrónico">
                        </div>

                        <button class="btn btn-senafy w-100">
                            Registrarse
                        </button>
                    </div>

                </div>

            </div>

            <!-- HERO -->
            <div class="col-lg-7 px-lg-5 px-4">

                <div class="hero-image">

                    <!-- Reemplazar por ilustración real -->
                    <img src="https://images.unsplash.com/photo-1511379938547-c1f69419868d?q=80&w=1200" alt="Music">

                </div>

                <h1 class="hero-title">
                    Disfruta de música<br>
                    y podcasts
                </h1>

                <p class="hero-description">
                    Reproduce tus canciones y podcasts favoritos de manera ilimitada.
                </p>

                <div class="mt-5 footer-text">
                    ¿No tienes una cuenta?
                    <a href="#" class="register-link">
                        Regístrate
                    </a>
                </div>

            </div>

        </div>

    </div>

</body>

</html>
